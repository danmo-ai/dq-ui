<!DOCTYPE html>
<html lang="zh-CN" class="dq-mac dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanQing UI — Theme Gallery</title>
  <link id="theme-css" rel="stylesheet" href="../src/dq-mac.css">
  <link id="recipe-css" rel="stylesheet" href="../src/dq-recipe-dark.css">
  <link rel="stylesheet" href="../src/dq-glass.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      color: var(--dq-label-primary);
      font-family: var(--dq-font-sans);
      font-size: var(--dq-font-size-secondary);
      line-height: var(--dq-line-height-relaxed);
      background-color: var(--dq-bg-page);
      background-image: var(--dq-bg-page-glow);
      background-repeat: no-repeat;
    }

    .layout {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .hero { margin-bottom: 28px; }
    .hero h1 {
      font-size: var(--dq-font-size-page);
      font-weight: 700;
      letter-spacing: var(--dq-tracking-tighter);
      margin-bottom: 8px;
    }
    .hero p { color: var(--dq-label-secondary); max-width: 640px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .theme-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: var(--dq-radius-button);
      border: 1px solid var(--dq-border);
      background: var(--dq-fill-control);
      color: var(--dq-label-secondary);
      font: inherit;
      font-size: var(--dq-font-size-body);
      font-weight: 500;
      cursor: pointer;
      transition: var(--dq-transition-hover);
    }
    .theme-btn:hover {
      background: var(--dq-fill-secondary);
      color: var(--dq-label-primary);
    }
    .theme-btn.is-active {
      background: var(--dq-accent-surface);
      border-color: var(--dq-accent-surface-border);
      color: var(--dq-accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .panel {
      padding: 16px;
      border-radius: var(--dq-radius-group);
      border: 1px solid var(--dq-border-hairline);
      background: var(--dq-glass-panel-bg);
      backdrop-filter: var(--dq-glass-blur);
      -webkit-backdrop-filter: var(--dq-glass-blur);
      box-shadow: var(--dq-shadow-glass);
    }
    .panel h2 {
      font-size: var(--dq-font-size-body);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--dq-border-hairline);
    }
    .swatch-label {
      font-family: var(--dq-font-mono);
      font-size: 12px;
      color: var(--dq-label-tertiary);
    }

    .btn-row, .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .demo-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--dq-radius-button);
      border: 1px solid var(--dq-border);
      background: var(--dq-fill-control);
      color: var(--dq-label-primary);
      font: inherit;
      cursor: pointer;
    }
    .demo-btn--primary {
      background: var(--dq-accent);
      border-color: transparent;
      color: var(--dq-on-accent);
    }
    .demo-btn--ghost {
      background: transparent;
    }
    .demo-input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border-radius: var(--dq-radius-input);
      border: 1px solid var(--dq-glass-control-border);
      background: var(--dq-glass-control-bg);
      color: var(--dq-label-primary);
      font: inherit;
    }
    .demo-input:focus {
      outline: none;
      border-color: var(--dq-glass-control-border-focus);
      box-shadow: var(--dq-focus-ring);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag--success {
      color: var(--dq-success);
      background: var(--dq-success-surface);
      border: 1px solid var(--dq-success-surface-border);
    }
    .tag--warning {
      color: var(--dq-warning);
      background: var(--dq-warning-surface);
      border: 1px solid var(--dq-warning-surface-border);
    }
    .tag--danger {
      color: var(--dq-danger);
      background: var(--dq-danger-surface);
      border: 1px solid var(--dq-danger-surface-border);
    }
    .tag--accent {
      color: var(--dq-accent);
      background: var(--dq-accent-surface);
      border: 1px solid var(--dq-accent-surface-border);
    }

    .glass-demo { margin-top: 8px; padding: 14px; }
    .shell-demo {
      display: grid;
      grid-template-columns: 120px 1fr 120px;
      min-height: 120px;
      margin-top: 8px;
      border: 1px solid var(--dq-shell-divider);
      overflow: hidden;
    }
    .shell-demo__side {
      background: var(--dq-shell-sidebar-bg);
      backdrop-filter: var(--dq-shell-sidebar-blur);
      -webkit-backdrop-filter: var(--dq-shell-sidebar-blur);
      border-right: 1px solid var(--dq-shell-sidebar-border);
      padding: 12px;
      font-size: 12px;
      color: var(--dq-label-secondary);
    }
    .shell-demo__stream {
      background: var(--dq-shell-stream-bg);
      padding: 12px;
      font-size: 12px;
      color: var(--dq-label-tertiary);
    }
    .shell-demo__panel {
      background: var(--dq-shell-panel-bg);
      backdrop-filter: var(--dq-shell-panel-blur);
      -webkit-backdrop-filter: var(--dq-shell-panel-blur);
      border-left: 1px solid var(--dq-shell-panel-border);
      padding: 12px;
      font-size: 12px;
      color: var(--dq-label-secondary);
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hero">
      <h1 id="hero-title">DanQing UI Themes</h1>
      <p id="hero-desc">macOS 26 Liquid Glass · system blue dark</p>
    </header>

    <div class="toolbar">
      <button class="theme-btn is-active" data-theme="mac" type="button">macOS</button>
      <button class="theme-btn" data-theme="macLight" type="button">macOS Light</button>
      <button class="theme-btn" data-theme="tokyoNight" type="button">Tokyo Night</button>
      <button class="theme-btn" data-theme="nordDark" type="button">Nord Dark</button>
      <button class="theme-btn" data-theme="minimalLight" type="button">Minimal Light</button>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Surfaces</h2>
        <div class="swatch-row"><div class="swatch" style="background: var(--dq-bg-page)"></div><span class="swatch-label">--dq-bg-page</span></div>
        <div class="swatch-row"><div class="swatch" style="background: var(--dq-bg-base)"></div><span class="swatch-label">--dq-bg-base</span></div>
        <div class="swatch-row"><div class="swatch" style="background: var(--dq-bg-elevated)"></div><span class="swatch-label">--dq-bg-elevated</span></div>
        <div class="swatch-row"><div class="swatch" style="background: var(--dq-accent)"></div><span class="swatch-label">--dq-accent</span></div>
      </section>

      <section class="panel">
        <h2>Buttons</h2>
        <div class="btn-row">
          <button class="demo-btn" type="button">Default</button>
          <button class="demo-btn demo-btn--primary" type="button">Primary</button>
          <button class="demo-btn demo-btn--ghost" type="button">Ghost</button>
        </div>
      </section>

      <section class="panel">
        <h2>Input</h2>
        <input class="demo-input" placeholder="Focus to preview ring…">
      </section>

      <section class="panel">
        <h2>Semantic Tags</h2>
        <div class="tag-row">
          <span class="tag tag--accent">Accent</span>
          <span class="tag tag--success">Success</span>
          <span class="tag tag--warning">Warning</span>
          <span class="tag tag--danger">Danger</span>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top: 16px">
      <h2>Shell (soft glass)</h2>
      <div class="shell-demo">
        <div class="shell-demo__side">Sidebar</div>
        <div class="shell-demo__stream">Stream canvas</div>
        <div class="shell-demo__panel">Panel</div>
      </div>
    </section>

    <section class="panel" style="margin-top: 16px">
      <h2>Glass Panel</h2>
      <div class="dq-glass--panel glass-demo">
        Popover / dialog surface using <code>.dq-glass--panel</code>.
      </div>
    </section>
  </div>

  <script type="module">
    const THEMES = {
      mac: {
        className: 'dq-mac',
        dark: true,
        css: '../src/dq-mac.css',
        recipe: '../src/dq-recipe-dark.css',
        title: 'macOS',
        desc: 'macOS 26 Liquid Glass · system blue dark',
      },
      macLight: {
        className: 'dq-mac-light',
        dark: false,
        css: '../src/dq-mac-light.css',
        recipe: '../src/dq-recipe-light.css',
        title: 'macOS Light',
        desc: 'macOS 26 Liquid Glass · system blue light',
      },
      tokyoNight: {
        className: 'dq-tokyo-night',
        dark: true,
        css: '../src/dq-tokyo-night.css',
        recipe: '../src/dq-recipe-dark.css',
        title: 'Tokyo Night',
        desc: 'macOS 26 Liquid Glass · cool navy accent',
      },
      nordDark: {
        className: 'dq-nord-dark',
        dark: true,
        css: '../src/dq-nord-dark.css',
        recipe: '../src/dq-recipe-dark.css',
        title: 'Nord Dark',
        desc: 'macOS 26 Liquid Glass · frost accent',
      },
      minimalLight: {
        className: 'dq-minimal-light',
        dark: false,
        css: '../src/dq-minimal-light.css',
        recipe: '../src/dq-recipe-light.css',
        title: 'Minimal Light',
        desc: 'macOS 26 Liquid Glass · paper white',
      },
    };

    const html = document.documentElement;
    const themeCss = document.getElementById('theme-css');
    const recipeCss = document.getElementById('recipe-css');
    const buttons = document.querySelectorAll('.theme-btn');

    function applyTheme(id) {
      const theme = THEMES[id];
      if (!theme) return;

      Object.values(THEMES).forEach((entry) => html.classList.remove(entry.className));
      html.classList.toggle('dark', theme.dark);
      html.classList.add(theme.className);
      themeCss.href = theme.css;
      recipeCss.href = theme.recipe;

      document.getElementById('hero-title').textContent = theme.title;
      document.getElementById('hero-desc').textContent = theme.desc;

      buttons.forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.theme === id);
      });

      localStorage.setItem('dq-demo-theme', id);
    }

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    const stored = localStorage.getItem('dq-demo-theme');
    applyTheme(stored && THEMES[stored] ? stored : 'mac');
  </script>
</body>
</html>
